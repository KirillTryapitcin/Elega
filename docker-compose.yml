# Local stack. Not a production deployment: credentials are local-only placeholders and
# every port is bound to 127.0.0.1. Open http://localhost:8080 after `docker compose up --build`.
name: elega

x-node-env: &node-env
  NODE_ENV: production
  # Production build, local deployment: lets the local-only credentials below through.
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgres://elega:elega_local_only@postgres:5432/elega
  REDIS_URL: redis://:elega_local_only@redis:6379

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: elega
      POSTGRES_PASSWORD: elega_local_only
      POSTGRES_DB: elega
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elega -d elega']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', 'elega_local_only']
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'elega_local_only', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.48
    command:
      [
        'mini',
        '-dir=/data',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-bucket=elega-private,elega-public',
      ]
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - 127.0.0.1:8333:8333
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025

  migrate:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: api }
    image: elega/api:local
    command: ['node', 'dist/db/migrate-cli.js']
    environment: *node-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: elega/api:local
    environment:
      <<: *node-env
      PORT: 3001
      TRUST_PROXY_HOPS: 1
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: worker }
    image: elega/worker:local
    environment:
      <<: *node-env
      HEALTH_PORT: 3002
      HEARTBEAT_EVERY_MS: 10000
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: web }
    image: elega/web:local
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  s3-data:
