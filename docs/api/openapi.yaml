components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA, 15 min)
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-elega_rt
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
      description: Opaque, HMAC-signed
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Retries with the same key and body return the original response for 24 h
    CsrfHeader:
      name: X-Elega-CSRF
      in: header
      required: true
      schema:
        const: '1'
  responses:
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or hidden from this viewer (blocks and private content return 404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - unauthorized
              - forbidden
              - not_found
              - validation_failed
              - conflict
              - rate_limited
              - payload_too_large
              - unsupported_media_type
              - internal_error
              - mfa_required
              - registration_closed
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                additionalProperties: false
                required:
                - message
            requestId:
              type: string
          additionalProperties: false
          required:
          - code
          - message
          - requestId
      additionalProperties: false
      required:
      - error
    PageInfo:
      type: object
      properties:
        nextCursor:
          oneOf:
          - type: string
          - type: 'null'
        hasMore:
          type: boolean
      additionalProperties: false
      required:
      - nextCursor
      - hasMore
    Ok:
      type: object
      properties:
        ok:
          const: true
      additionalProperties: false
      required:
      - ok
    Count:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - count
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 256
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        username:
          type: string
          pattern: ^[a-z0-9._]{3,30}$
        birthdate:
          type: string
          format: date
        inviteCode:
          type: string
          maxLength: 64
        locale:
          type: string
          enum:
          - ru
          - en
        acceptedTermsVersion:
          type: string
        acceptedPrivacyVersion:
          type: string
        captchaToken:
          type: string
      additionalProperties: false
      required:
      - email
      - password
      - displayName
      - username
      - birthdate
      - acceptedTermsVersion
      - acceptedPrivacyVersion
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Email or username
        password:
          type: string
        rememberDevice:
          type: boolean
        captchaToken:
          type: string
      additionalProperties: false
      required:
      - identifier
      - password
    MfaLoginRequest:
      type: object
      properties:
        mfaToken:
          type: string
        code:
          type: string
          pattern: ^([0-9]{6}|[A-Z0-9]{10})$
      additionalProperties: false
      required:
      - mfaToken
      - code
    AuthResult:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/Me'
      additionalProperties: false
      required:
      - accessToken
      - expiresIn
      - user
      description: Refresh token is set as the __Host-elega_rt cookie, never in the body.
    MfaChallenge:
      type: object
      properties:
        mfaRequired:
          const: true
        mfaToken:
          type: string
      additionalProperties: false
      required:
      - mfaRequired
      - mfaToken
    TokenRequest:
      type: object
      properties:
        token:
          type: string
      additionalProperties: false
      required:
      - token
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      additionalProperties: false
      required:
      - email
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 10
      additionalProperties: false
      required:
      - token
      - newPassword
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
    ChangeEmailRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newEmail:
          type: string
          format: email
      additionalProperties: false
      required:
      - currentPassword
      - newEmail
    PasswordConfirm:
      type: object
      properties:
        password:
          type: string
        code:
          type: string
          description: TOTP code when 2FA is on
      additionalProperties: false
      required:
      - password
    TotpSetup:
      type: object
      properties:
        otpauthUrl:
          type: string
        qrSvg:
          type: string
      additionalProperties: false
      required:
      - otpauthUrl
      - qrSvg
    TotpConfirmRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
      additionalProperties: false
      required:
      - code
    RecoveryCodes:
      type: object
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
          minItems: 10
          maxItems: 10
      additionalProperties: false
      required:
      - recoveryCodes
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        userAgent:
          type: string
        coarseLocation:
          oneOf:
          - type: string
          - type: 'null'
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        current:
          type: boolean
      additionalProperties: false
      required:
      - id
      - lastUsedAt
      - createdAt
      - current
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        avatar:
          oneOf:
          - $ref: '#/components/schemas/MediaVariants'
          - type: 'null'
        isVerifiedPage:
          type: boolean
        isNewAccount:
          type: boolean
      additionalProperties: false
      required:
      - id
      - username
      - displayName
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - user
          - moderator
          - analyst
          - admin
        isMinor:
          type: boolean
        locale:
          type: string
          enum:
          - ru
          - en
        timezone:
          type: string
        twoFactorEnabled:
          type: boolean
        profile:
          $ref: '#/components/schemas/Profile'
      additionalProperties: false
      required:
      - id
      - email
      - emailVerified
      - username
      - displayName
      - role
      - isMinor
      - locale
      - timezone
    Profile:
      type: object
      properties:
        bio:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
        city:
          oneOf:
          - type: string
          - type: 'null'
        workplace:
          oneOf:
          - type: string
          - type: 'null'
        education:
          oneOf:
          - type: string
          - type: 'null'
        website:
          oneOf:
          - type: string
            format: uri
          - type: 'null'
        birthday:
          oneOf:
          - type: string
            format: date
          - type: 'null'
        pronouns:
          oneOf:
          - type: string
          - type: 'null'
        relationshipStatus:
          oneOf:
          - type: string
          - type: 'null'
        links:
          type: array
          items:
            type: string
            format: uri
          maxItems: 5
        avatar:
          oneOf:
          - $ref: '#/components/schemas/MediaVariants'
          - type: 'null'
        cover:
          oneOf:
          - $ref: '#/components/schemas/MediaVariants'
          - type: 'null'
        fieldAudience:
          type: object
          additionalProperties:
            type: string
            enum:
            - public
            - friends
            - friends_of_friends
            - only_me
            - custom_list
      additionalProperties: false
    ProfileView:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        profile:
          $ref: '#/components/schemas/Profile'
        mutualFriendsCount:
          type: integer
        relationship:
          type: string
          enum:
          - self
          - friend
          - request_sent
          - request_received
          - following
          - none
        pinnedPostId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
      additionalProperties: false
      required:
      - user
      - profile
      - relationship
      description: Fields the viewer may not see are omitted, never sent as null.
    MeUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        username:
          type: string
          pattern: ^[a-z0-9._]{3,30}$
        profile:
          $ref: '#/components/schemas/Profile'
        locale:
          type: string
          enum:
          - ru
          - en
        timezone:
          type: string
      additionalProperties: false
    Settings:
      type: object
      properties:
        theme:
          type: string
          enum:
          - light
          - dark
          - system
        fontScale:
          type: number
          minimum: 1
          maximum: 2
        feedMode:
          type: string
          enum:
          - chronological
          - for_you
        whoCanMessage:
          type: string
          enum:
          - everyone
          - friends
          - nobody
        whoCanSendFriendRequests:
          type: string
          enum:
          - everyone
          - friends_of_friends
          - nobody
        whoCanSeeOnlineStatus:
          type: string
          enum:
          - everyone
          - friends
          - nobody
        whoCanMention:
          type: string
          enum:
          - everyone
          - friends
          - nobody
        allowFollowers:
          type: boolean
        readReceiptsEnabled:
          type: boolean
        defaultPostAudience:
          type: string
          enum:
          - public
          - friends
          - close_friends
          - only_me
        searchEngineIndexing:
          type: boolean
        discoverableByEmail:
          type: boolean
        dataSaver:
          type: boolean
      additionalProperties: false
    ExportJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - ready
          - failed
          - expired
        downloadUrl:
          oneOf:
          - type: string
            format: uri
          - type: 'null'
        expiresAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        requestedAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - status
      - requestedAt
    DeletionStatus:
      type: object
      properties:
        scheduledFor:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - scheduledFor
    FriendRequestCreate:
      type: object
