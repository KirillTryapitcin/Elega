          type: string
          format: uuid
        from:
          $ref: '#/components/schemas/UserSummary'
        to:
          $ref: '#/components/schemas/UserSummary'
        mutualFriendsCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - from
      - to
      - createdAt
    Friend:
