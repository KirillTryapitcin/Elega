        user:
          $ref: '#/components/schemas/UserSummary'
        since:
          type: string
          format: date-time
        city:
          oneOf:
          - type: string
          - type: 'null'
      additionalProperties: false
      required:
      - user
      - since
    MuteCreate:
      type: object
