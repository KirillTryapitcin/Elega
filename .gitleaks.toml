title = "Elega gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Local-only development placeholders (docker-compose.yml, .env.example; production refuses any value containing local_only) and the fixed APP_SECRET of the integration tests (apps/api/test)."
regexes = ['''elega_local_only(_secret)?''', '''integration-test-secret-0123456789abcdef''']
